# SciRalph model registry
# Friendly keys map to provider + model_id + env_key
# Use with: --model <key> (e.g., --model claude-sonnet-4.6)
# Costs are in USD per million tokens

# ============================================================================
# Anthropic
# ============================================================================

claude-4.6-opus:
  provider: anthropic
  model_id: claude-opus-4-6
  env_key: ANTHROPIC_API_KEY
  input_cost: 5.00
  output_cost: 25.00
  max_output_tokens: 128000
  thinking: true
  effort: medium

claude-4.6-sonnet:
  provider: anthropic
  model_id: claude-sonnet-4-6
  env_key: ANTHROPIC_API_KEY
  input_cost: 3.00
  output_cost: 15.00
  max_output_tokens: 65536
  thinking: true
  effort: medium

