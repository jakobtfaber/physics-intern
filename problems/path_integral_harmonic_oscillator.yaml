problem: |
  Evaluate the path integral for the quantum harmonic oscillator exactly
  and derive the propagator K(x_f, t_f; x_i, t_i) in closed form (the
  Mehler kernel). Extract the energy spectrum E_n = hbar*omega*(n+1/2)
  from the propagator and verify consistency with the operator formalism.
  Include numerical checks by evaluating the discretised path integral
  and comparing with the exact result.

requires_numerical: true
