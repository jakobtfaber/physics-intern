problem: |
  Solve the one-dimensional Ising model with nearest-neighbour coupling J
  and external magnetic field h exactly for a chain of N spins with periodic
  boundary conditions. Derive closed-form expressions for the free energy,
  magnetisation, susceptibility, and correlation length in the thermodynamic
  limit (N -> infinity). Verify that there is no spontaneous magnetisation
  at finite temperature and that the susceptibility diverges as T -> 0 at
  h = 0. Include numerical plots of the magnetisation curve.