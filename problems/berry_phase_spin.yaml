problem: |
  Compute the Berry phase acquired by a spin-1/2 particle when its
  magnetic field direction is adiabatically transported around a closed
  loop in parameter space. Show that the Berry phase equals minus half
  the solid angle subtended by the path on the unit sphere:
  gamma = -Omega/2. Identify the underlying geometric structure in the
  full 3D parameter space. Verify by numerical simulation of the
  time-dependent Schrodinger equation for several cone angles and
  adiabaticity parameters.