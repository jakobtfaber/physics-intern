problem: |
  Derive the anomalous perihelion precession of Mercury from general
  relativity. Starting from the Schwarzschild metric, obtain the precession
  angle per orbit: Delta phi = 6*pi*G*M / (a*(1-e^2)*c^2). Compute the
  result for Mercury in arcseconds per century (expected: ~43 arcsec/century).
  Verify by numerically integrating the full relativistic orbital equation
  and measuring the precession directly.

requires_numerical: true