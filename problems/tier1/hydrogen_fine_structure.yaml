problem: |
  Compute the fine structure corrections to the hydrogen atom energy levels.
  Identify all relevant physical effects at order alpha^2, evaluate their
  contributions, and show that the total fine structure shift depends only
  on n and j (not l separately). The expected combined result is:
  Delta E_fs = (alpha^2 / n^2) * E_n^(0) * [n/(j+1/2) - 3/4].
  Numerically compute the splittings for n=1,2,3 in eV.

requires_numerical: true