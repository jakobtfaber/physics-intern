problem: |
  # Problem setup:
  The hydrogen atom energy levels receive corrections at order $\alpha^2$ relative to the Bohr energies $E_n^{(0)} = -m_e c^2 \alpha^2 / (2n^2)$, where $\alpha$ is the fine-structure constant, $m_e$ the electron mass, $c$ the speed of light, and $n$ the principal quantum number.

  Three physical effects contribute at this order: the relativistic kinetic energy correction (mass-velocity term) from expanding the relativistic kinetic energy $\sqrt{p^2 c^2 + m_e^2 c^4} - m_e c^2$ to order $p^4$; the spin-orbit coupling $H_{\rm SO} \propto \mathbf{L} \cdot \mathbf{S} / r^3$ arising from the interaction of the electron's magnetic moment with the magnetic field seen in its rest frame; and the Darwin term, a contact interaction proportional to $\delta^3(\mathbf{r})$ arising from the Zitterbewegung of the electron.

  A remarkable result is that when all three contributions are summed, the total fine-structure shift depends only on the quantum numbers $n$ and $j$ (the total angular momentum), not on $l$ (the orbital angular momentum) separately.

  # Main problem:
  What is the total fine-structure energy shift $\Delta E_{\rm fs}(n, j)$ of the hydrogen atom, expressed in terms of $m_e$, $c$, $\alpha$, $n$, and $j$?


answer: |
  Delta_E_fs = -m_e * c**2 * alpha**4 / (2 * n**3) * (1 / (j + sp.Rational(1, 2)) - 3 / (4 * n))

