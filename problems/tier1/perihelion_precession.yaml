problem: |
  # Problem setup:
  In general relativity, a test particle orbiting a central mass $M$ follows a geodesic of the Schwarzschild metric. The effective potential for the radial motion acquires an additional $-GMl^2/(m c^2 r^3)$ term compared to Newtonian gravity (where $l$ is the specific angular momentum), which causes the orbit to precess.

  For a bound orbit with semi-major axis $a$ and eccentricity $e$, the orbit equation in Newtonian gravity yields a closed ellipse. In general relativity, the orbit is nearly elliptical but the perihelion advances by a small angle $\Delta\phi$ each orbit. This effect was famously confirmed for Mercury, whose anomalous precession of $\sim 43''$ per century was one of the first experimental tests of general relativity.

  The precession can be computed perturbatively by expanding the relativistic orbit equation $d^2 u/d\phi^2 + u = GM/(l^2/m) + 3GMu^2/c^2$ (where $u = 1/r$) to first order in the small relativistic correction.

  Let $G$ be Newton's gravitational constant and $c$ the speed of light.

  # Main problem:
  What is the perihelion precession angle $\Delta\phi$ per orbit for a test particle in a Schwarzschild spacetime, expressed in terms of $G$, $M$, $a$, $e$, and $c$?

requires_numerical: true

answer: |
  Delta_phi = 6 * sp.pi * G * M / (a * (1 - e**2) * c**2)

