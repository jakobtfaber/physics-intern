problem: |
  # Problem setup:
  Consider a non-relativistic quantum particle of mass $m$ in a harmonic potential $V(x) = \tfrac{1}{2} m \omega^2 x^2$, where $\omega$ is the angular frequency. The quantum propagator $K(x_f, T; x_i, 0)$ gives the probability amplitude for the particle to travel from position $x_i$ at time $0$ to position $x_f$ at time $T$.

  In Feynman's path integral formulation, the propagator is expressed as a functional integral over all paths $x(t)$ connecting $(x_i, 0)$ to $(x_f, T)$: $K = \int \mathcal{D}[x]\, e^{iS[x]/\hbar}$, where $S[x] = \int_0^T \left[\tfrac{1}{2}m\dot{x}^2 - \tfrac{1}{2}m\omega^2 x^2\right] dt$ is the classical action.

  For the harmonic oscillator, the path integral can be evaluated exactly because the action is quadratic in $x(t)$. Writing $x(t) = x_{\rm cl}(t) + y(t)$ where $x_{\rm cl}(t)$ is the classical trajectory satisfying the boundary conditions, the fluctuation integral over $y(t)$ factorises and yields a prefactor independent of the endpoints. The result is the Mehler kernel.

  Let $\hbar$ be the reduced Planck constant and $i$ the imaginary unit.

  # Main problem:
  What is the exact propagator $K(x_f, T; x_i, 0)$ for the quantum harmonic oscillator, expressed in terms of $m$, $\omega$, $\hbar$, $T$, $x_i$, and $x_f$?

requires_numerical: true

answer: |
  K = sp.sqrt(m*omega/(2*sp.pi*sp.I*hbar*sp.sin(omega*T))) * sp.exp(sp.I*m*omega/(2*hbar*sp.sin(omega*T)) * ((x_f**2 + x_i**2)*sp.cos(omega*T) - 2*x_f*x_i))

