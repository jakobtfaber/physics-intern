problem: |
  Derive the Chandrasekhar mass limit for white dwarf stars. Starting from
  the physics of a degenerate relativistic electron gas and the equations of
  stellar structure, obtain the maximum mass a white dwarf can support.
  The expected result is M_Ch = 5.836/mu_e^2 solar masses (about 1.46 M_sun
  for carbon/oxygen composition). Numerically solve the relevant structure
  equations, compute the mass-radius relation, and verify that the radius
  vanishes as the mass approaches M_Ch.

requires_numerical: true
