problem: |
  In the Thomas-Fermi model, the ground-state energy of a neutral atom of atomic number Z
  Z takes the form E_TF = - c * (e^2/a_0) * Z^{7/3} where a0 is the Bohr radius. 
  Starting from the semiclassical approximation that treats electrons as a locally free, 
  fully degenerate Fermi gas in a self-consistent electrostatic potential,
  compute the numerical constant c up to 4 significant digits.

requires_numerical: true