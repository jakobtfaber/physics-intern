problem: |
  # Problem setup:
  Consider the two-dimensional Ising model on an infinite square lattice with nearest-neighbour ferromagnetic coupling $J > 0$ and zero external magnetic field. Each spin $s_{i,j} = \pm 1$ sits on a lattice site, and the Hamiltonian is $\mathcal{H} = -J \sum_{\langle i,j \rangle} s_i s_j$, where the sum runs over all nearest-neighbour pairs.

  In 1944, Onsager provided the first exact solution, showing that this model has a continuous phase transition at a critical temperature $T_c$ separating a disordered paramagnetic phase ($T > T_c$) from an ordered ferromagnetic phase ($T < T_c$). The critical temperature can be determined from the condition that the fermion mass gap in the transfer matrix formulation vanishes, or equivalently from the self-duality relation $\sinh(2J/(k_B T_c)) = 1$.

  Let $k_B$ be the Boltzmann constant.

  # Main problem:
  What is the dimensionless critical temperature $k_B T_c / J$ of the 2D Ising model on a square lattice?


answer: |
  kBTc_over_J = 2 / sp.log(1 + sp.sqrt(2))

