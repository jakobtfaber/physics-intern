problem: |
  # Problem setup:
  The Dirac equation for an electron (mass $m_e$) in the Coulomb potential of a nucleus with charge $Ze$ can be solved exactly. After separating the angular part using spinor spherical harmonics labelled by total angular momentum $j$ and parity quantum number $\kappa$, the radial Dirac equations form a coupled system for the large and small components.

  Solving by a power series method (analogous to the confluent hypergeometric solution for the non-relativistic hydrogen atom) and imposing regularity and normalisability, one obtains the Sommerfeld fine-structure formula for the bound-state energy levels. This exact formula depends on the principal quantum number $n$, the total angular momentum quantum number $j$, the nuclear charge $Z$, and the fine-structure constant $\alpha = e^2/(\hbar c)$.

  The formula is valid for $Z\alpha < j + 1/2$ (for larger $Z$, the point-nucleus solution becomes singular). When expanded to order $(Z\alpha)^4$, the Sommerfeld formula reproduces the non-relativistic Bohr energy plus the perturbative fine-structure correction.

  # Main problem:
  What is the exact Dirac-Coulomb energy spectrum $E_{n,j}$ for a bound electron in a Coulomb potential of charge $Ze$, expressed in terms of $m_e$, $c$, $Z$, $\alpha$, $n$, and $j$?


answer: |
  E_nj = m_e * c**2 * (1 + (Z * alpha / (n - (j + sp.Rational(1,2)) + sp.sqrt((j + sp.Rational(1,2))**2 - Z**2 * alpha**2)))**2)**(-sp.Rational(1,2))

