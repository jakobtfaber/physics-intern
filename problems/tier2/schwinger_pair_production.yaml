problem: |
  # Problem setup:
  In quantum electrodynamics, a sufficiently strong constant uniform electric field $E$ can create electron-positron pairs from the vacuum — the Schwinger effect. This is a non-perturbative process: the rate involves an essential singularity $\sim \exp(-\pi m_e^2 c^3 / (eE\hbar))$ that cannot be obtained at any finite order in perturbation theory.

  The full pair production rate per unit volume is given by an infinite sum over multi-pair contributions (labelled by $n = 1, 2, 3, \ldots$). The $n$-th term corresponds to the $n$-th instanton in the worldline formalism (or the $n$-th term in the proper-time integration of the one-loop effective action). For spin-1/2 particles (electrons), the rate includes an additional factor of 2 from the spin degrees of freedom compared to scalar QED.

  The critical field scale is $E_c = m_e^2 c^3 / (e\hbar) \approx 1.3 \times 10^{18}\,\mathrm{V/m}$, above which pair production becomes significant. For $E \ll E_c$, the rate is exponentially suppressed.

  Let $e$ denote the positron charge magnitude, $m_e$ the electron mass, $\hbar$ the reduced Planck constant, and $c$ the speed of light.

  # Main problem:
  What is the leading-order ($n = 1$) Schwinger pair production rate per unit volume $\Gamma/V$ for spin-1/2 particles, expressed in terms of $e$, $E$ (the electric field), $m_e$, $\hbar$, and $c$?


answer: |
  Gamma_over_V = (e_charge * E_field)**2 / (4 * sp.pi**3 * hbar**2 * c) * sp.exp(-sp.pi * m_e**2 * c**3 / (e_charge * E_field * hbar))

