problem: |
  Apply the WKB (semiclassical) approximation to the pure quartic
  oscillator V(x) = lambda*x^4. Derive the Bohr-Sommerfeld quantisation
  condition and evaluate the resulting action integral, which involves
  the complete Beta function B(1/2, 1/4+1/2) = B(1/2, 3/4). Show that
  the WKB energy eigenvalues scale as
  E_n ~ (hbar^2/m)^{2/3} * lambda^{1/3} * C * (n + 1/2)^{4/3}
  where C is an explicit numerical constant involving Gamma functions.
  Derive the connection formulae at the classical turning points.
  Then compute the exact eigenvalues numerically by diagonalising the
  Hamiltonian in a harmonic oscillator basis (or by Numerov integration).
  Compare the WKB eigenvalues with the numerical ones for n = 0 through
  n = 20. Discuss the accuracy of WKB as a function of quantum number.

requires_numerical: true
