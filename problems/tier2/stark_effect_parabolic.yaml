problem: |
  # Problem setup:
  The hydrogen atom can be solved in parabolic coordinates $(\xi, \eta, \phi)$, defined by $\xi = r + z$, $\eta = r - z$, $\phi = \arctan(y/x)$, where $(r, \theta, \phi)$ are the usual spherical coordinates. In these coordinates, the Schrödinger equation separates into three independent equations, introducing the parabolic quantum numbers $n_1, n_2 \geq 0$ (non-negative integers) and the magnetic quantum number $m$. The principal quantum number is $n = n_1 + n_2 + |m| + 1$.

  When a uniform static electric field $\mathbf{E} = E\hat{z}$ is applied (the Stark effect), parabolic coordinates are the natural basis for perturbation theory because the perturbation $H' = eEz = \tfrac{1}{2}eE(\xi - \eta)$ separates in these coordinates. This means the unperturbed parabolic states are already the correct zeroth-order states for degenerate perturbation theory — no diagonalisation is needed.

  The first-order energy correction is obtained by evaluating $\langle n_1, n_2, m | H' | n_1, n_2, m \rangle$ using the known expectation values of $\xi$ and $\eta$ in the parabolic eigenstates.

  Let $e$ denote the electron charge magnitude, $a_0$ the Bohr radius, and $E$ the applied electric field strength.

  # Main problem:
  What is the first-order (linear) Stark energy shift $\Delta E$ for a hydrogen state with quantum numbers $(n, n_1, n_2)$, expressed in terms of $e$, $E$ (the electric field), $a_0$, $n$, $n_1$, and $n_2$?


answer: |
  Delta_E = 3 * e_charge * E_field * a_0 * n * (n_1 - n_2) / 2

