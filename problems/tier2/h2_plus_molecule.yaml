  # Problem setup:
  The hydrogen molecular ion $\mathrm{H}_2^+$ consists of two protons and a single electron. It is the simplest molecule in nature and the only one for which the electronic Schrödinger equation can be solved exactly (by separation in prolate spheroidal coordinates).

  In the Born-Oppenheimer approximation, the two protons are held at fixed separation $R$, and one solves for the electronic energy $E(R)$. In prolate spheroidal coordinates $(\xi, \eta, \phi)$, where $\xi = (r_A + r_B)/R$ and $\eta = (r_A - r_B)/R$ with $r_A, r_B$ the distances from the electron to each proton, the Schrödinger equation separates into three independent ODEs. The resulting ground-state energy curve $E(R)$ has a minimum at the equilibrium bond length $R_{\rm eq} \approx 2.00\,a_0$ (Bohr radii).

  The dissociation energy $D_e$ is defined as the depth of this potential well: $D_e = E(\infty) - E(R_{\rm eq})$, where $E(\infty) = -0.5\,E_h$ is the energy of a hydrogen atom (the dissociation limit), and $E_h$ is the Hartree energy ($\approx 27.211\,\mathrm{eV}$).

  # Main problem:
  What is the dissociation energy $D_e$ of the $\mathrm{H}_2^+$ molecular ion, in electron volts (eV)?


answer: 2.791

