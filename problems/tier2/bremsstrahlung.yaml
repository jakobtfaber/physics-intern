problem: |
  # Problem setup:
  Consider a non-relativistic electron (mass $m_e$, charge $e$) scattered by the Coulomb field of a nucleus of charge $Ze$. The electron follows a classical hyperbolic trajectory, and the time-varying acceleration during the encounter causes it to radiate electromagnetic energy — a process known as bremsstrahlung ("braking radiation").

  The spectral energy radiated per unit frequency $dW/d\omega$ is obtained from the Fourier transform of the electric dipole moment $\mathbf{d}(t) = e\,\mathbf{r}(t)$ along the trajectory. In the soft-photon limit ($\omega \to 0$), the spectrum becomes flat, and the result simplifies to the Kramers formula for bremsstrahlung.

  The Kramers spectral energy depends on the electron's velocity $v$ at infinity (the asymptotic speed far from the nucleus), the nuclear charge $Ze$, and the electron charge and mass. It represents the frequency-independent floor of the bremsstrahlung spectrum, valid for photon energies $\hbar\omega \ll \tfrac{1}{2}m_e v^2$.

  Let $e$ denote the electron charge magnitude and $c$ the speed of light.

  # Main problem:
  What is the Kramers spectral energy $dW/d\omega$ in the soft-photon limit ($\omega \to 0$) for classical bremsstrahlung of an electron in a Coulomb field of charge $Ze$, expressed in terms of $Z$, $e$, $m_e$, $v$, and $c$?


answer: |
  dW_domega = 16 * sp.pi * Z**2 * e_charge**6 / (3 * sp.sqrt(3) * m_e**2 * c**3 * v**2)

