problem: |
  # Problem setup:
  Consider a charged particle (charge $e$, wave number $k$) scattering off an infinitely long, impenetrable solenoid of negligible radius carrying a total magnetic flux $\Phi$. Outside the solenoid the magnetic field is zero ($\mathbf{B} = 0$), but the vector potential $\mathbf{A}$ is non-zero and given by $\mathbf{A} = \Phi/(2\pi r)\,\hat{\boldsymbol{\phi}}$ in cylindrical coordinates.

  The Schrödinger equation in the presence of $\mathbf{A}$ (with $\mathbf{B} = 0$) is equivalent to the free-particle equation but with shifted angular momentum quantum numbers: $m \to m - \alpha$, where $\alpha = e\Phi/(2\pi\hbar c)$ is the dimensionless flux parameter. The scattering depends only on the fractional part of $\alpha$, a consequence of the Aharonov-Bohm effect — a purely quantum mechanical phenomenon where a charged particle is affected by the vector potential even in a region where the magnetic field vanishes.

  Using partial wave analysis with the shifted angular momenta, one can sum the series to obtain a closed-form expression for the differential scattering cross section (per unit length of the solenoid) in two dimensions.

  Let $\theta$ be the scattering angle ($\theta \neq 0$).

  # Main problem:
  What is the Aharonov-Bohm differential scattering cross section $d\sigma/d\theta$ as a function of $k$, $\alpha$, and $\theta$?


answer: |
  dsigma_dtheta = sp.sin(sp.pi * alpha)**2 / (2 * sp.pi * k * sp.sin(theta / 2)**2)

