problem: |
  Derive the thermodynamic properties of a quantum harmonic oscillator
  with frequency omega at temperature T: the partition function, mean energy,
  and heat capacity. The expected heat capacity is
  C_V = k_B * (beta*hbar*omega)^2 * exp(beta*hbar*omega) / (exp(beta*hbar*omega) - 1)^2.
  Verify the classical (high-T) and quantum (low-T) limiting behaviours.