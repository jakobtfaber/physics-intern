1problem: |
  Perform the one-loop renormalisation of scalar phi^4 theory in d=4
  dimensions. Compute all one-loop 1PI diagrams, extract the divergences,
  determine the counterterms, and derive the one-loop beta function.
  The expected result is beta(lambda) = 3*lambda^2 / (16*pi^2).
  Discuss asymptotic freedom (or lack thereof) and locate the Landau pole.
  Verify the Feynman parameter integrals numerically for specific kinematics.
