problem: |
  Derive the Casimir force per unit area between two perfectly conducting
  parallel plates separated by a distance a in 3+1 dimensions. The expected
  result is F/A = -pi^2 * hbar * c / (240 * a^4). Compute the Casimir
  pressure in Pascals for a = 1 micrometre and include numerical verification
  of any regularisation steps.

requires_numerical: true