[project]
name = "open-dirac"
version = "0.1.0"
description = "Multi-agent scientific research system"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "sympy>=1.13",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
openai = ["openai>=1.0"]
google = ["google-genai>=1.0"]
huggingface = ["huggingface-hub>=0.25"]
all-providers = ["openai>=1.0", "google-genai>=1.0", "huggingface-hub>=0.25"]
local = [
    "vllm==0.19.0; sys_platform == 'linux'",
    "flashinfer-python==0.6.6; sys_platform == 'linux'",
    "flashinfer-cubin==0.6.6; sys_platform == 'linux'",
    "hf-transfer; sys_platform == 'linux'",
]

[project.scripts]
open_dirac = "open_dirac.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_dirac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
