[project]
name = "sciralph"
version = "0.1.0"
description = "Multi-agent scientific research system"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "sympy>=1.13",
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciralph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
